name: UI CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "src/UI/**"
      - ".github/workflows/ui-ci.yml"
  pull_request:
    paths:
      - "src/UI/**"
      - ".github/workflows/ui-ci.yml"
  workflow_dispatch:

jobs:
  ui-ci:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/UI/package-lock.json

      - name: Install dependencies
        working-directory: src/UI
        run: npm ci

      - name: Lint
        working-directory: src/UI
        run: npm run lint

      - name: Typecheck
        working-directory: src/UI
        run: npm run typecheck

      - name: Build
        working-directory: src/UI
        run: npm run build

      - name: Upload build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: src/UI/dist
          if-no-files-found: error

  ui-deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: ui-ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOST: ${{ secrets.UI_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.UI_DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.UI_DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.UI_DEPLOY_PATH }}
      DEPLOY_POST_CMD: ${{ secrets.UI_DEPLOY_POST_CMD }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui-dist

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.UI_DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          PORT="${DEPLOY_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ensure deploy directory exists
        run: |
          PORT="${DEPLOY_PORT:-22}"
          ssh -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"

      - name: Sync dist to server
        run: |
          PORT="${DEPLOY_PORT:-22}"
          rsync -az --delete -e "ssh -p $PORT" ui-dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Run post-deploy command (optional)
        run: |
          if [ -n "$DEPLOY_POST_CMD" ]; then
            PORT="${DEPLOY_PORT:-22}"
            ssh -p "$PORT" "$DEPLOY_USER@$DEPLOY_HOST" "$DEPLOY_POST_CMD"
          else
            echo "UI_DEPLOY_POST_CMD is empty, skipping post-deploy command."
          fi
