services:
  cleanarchitecture.api:
    image: ${DOCKER_REGISTRY:-}cleanarchitectureapi
    build:
      context: .
      dockerfile: src/ModularMonolith/CleanArchitecture.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      cleanarchitecture.dbmigrator:
        condition: service_completed_successfully
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-CleanArchitecture};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}

  cleanarchitecture.dbmigrator:
    image: ${DOCKER_REGISTRY:-}cleanarchitecturedbmigrator
    build:
      context: .
      dockerfile: src/ModularMonolith/DbMigrator/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-CleanArchitecture};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - MigrationSettings__SeedData=${MIGRATOR_SEED_DATA:-true}
      - MigrationSettings__CreateDatabaseIfNotExists=true

  postgres:
    image: postgres:16
    container_name: cleanarchitecture-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-CleanArchitecture}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-CleanArchitecture}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - cleanarchitecture-pgdata:/var/lib/postgresql/data

volumes:
  cleanarchitecture-pgdata:
